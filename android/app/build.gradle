    tasks.configureEach { task ->
        if (task.name.contains('bundleRelease')) {
            task.doLast {
                // Generate mapping file for ProGuard/R8
                def mappingFile = "$buildDir/outputs/mapping/release/mapping.txt"
                println "ProGuard mapping file: $mappingFile"
                
                // Native symbols are automatically included in bundle
                println "Native debug symbols included in bundle"
