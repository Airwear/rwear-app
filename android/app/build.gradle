// Revenir à la racine du repo pour inclure tous les écrans (registration, cast)
def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def nodeBinary = System.getenv("NODE_BINARY") ?: "node"
def expoCliPath = [nodeBinary, "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"]
    .execute(null, rootDir)
    .text
    .trim()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    // Point d'entrée JS simplifié pour réduire la surface d'erreurs d'évaluation Gradle
    entryFile = file("$projectRoot/index.js")
    jsRootDir = file("$projectRoot")
    // Force un runtime Node compatible Metro si fourni via NODE_BINARY.
    nodeExecutableAndArgs = [nodeBinary]
    // Expo CLI évite l'usage du bundler RN legacy qui échoue en watch mode sous Windows
    cliFile = new File(expoCliPath)
    bundleCommand = "export:embed"
    // Autolinking standard
    autolinkLibrariesWithApp()
}

