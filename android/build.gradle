rootProject.name = "app"

def resolveExpoAutolinkingPath() {
    // chemins possibles où le plugin peut se trouver
    def candidates = [
        new File(rootDir, "../node_modules/expo-modules-autolinking/android/expo-gradle-plugin"),
        new File(rootDir, "../node_modules/expo/node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
    ]
    for (c in candidates) {
        if (c.exists()) {
            return c
        }
    }
    // fallback: return the first candidate (will produce the original error)
    return candidates[0]
}

apply from: new File([ "node", "--print", "require.resolve('expo/package.json')" ].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle")
useExpoModules()

// Include react-native app module
include ':app'

// Include expo autolinking plugin if present
def expoAutolinkingDir = resolveExpoAutolinkingPath()
if (expoAutolinkingDir.exists()) {
    includeBuild(expoAutolinkingDir)
} else {
    println("WARNING: expo-autolinking plugin not found at expected locations: " + expoAutolinkingDir)
}