pluginManagement {
    includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().toString())
}
plugins { id("com.facebook.react.settings") }

// Ensure Kotlin artifacts requested without explicit versions get the
// project's Kotlin version as early as possible (before project evaluation).
// Read the project gradle.properties directly because settings scripts do
// not expose the same helper methods as project scripts.
def _kotlinVersion = '1.9.25'
try {
  def props = new Properties()
  file(rootDir.absolutePath + '/gradle.properties').withInputStream { props.load(it) }
  if (props.getProperty('android.kotlinVersion')) {
    _kotlinVersion = props.getProperty('android.kotlinVersion')
  }
} catch (Exception e) {
  println "[settings.gradle] warning reading gradle.properties: ${e.message}"
}
println "[settings.gradle] aligning org.jetbrains.kotlin -> ${_kotlinVersion}"
gradle.beforeProject { p ->
  try {
    p.configurations?.all { cfg ->
      cfg.resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
          details.useVersion(_kotlinVersion)
        }
      }
    }
  } catch(Exception e) {
    // Ignore if configurations are not available yet for a given included build
  }
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    def command = [
      'node',
      '--no-warnings',
      '--eval',
      'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
      'react-native-config',
      '--json',
      '--platform',
      'android'
    ].toList()
    ex.autolinkLibrariesFromCommand(command)
  }
}

rootProject.name = 'Rwear App'

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      from(files(new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../gradle/libs.versions.toml")))
    }
  }
}

apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle");
useExpoModules()

include ':app'
